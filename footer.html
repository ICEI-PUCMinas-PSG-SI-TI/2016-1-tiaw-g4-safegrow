<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="style-avaliacao.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Footer-TI</title>
</head>
<body>

    <footer id="rodape">
        <div class="card rounded-3 d-flex flex-wrap align-items-center gap-2"
             style="background-color:#f5f0e8; padding:12px; border-style:dashed !important; border-color:#5b7fe0 !important;">

            <div class="card-header"
                 style="border-bottom:none; border-right:1px solid #c5b89a; padding:0px 12px 0px 0px;">
            </div>

            <div class="card-body"
                 style="display:flex; align-items:center; flex-wrap:wrap; gap:16px; background:#f5f0e8; flex:1; padding:0px 0px 0px 12px;">
                <div class="icones" style="display:flex; gap:8px;"></div>
                <div class="divisor" style="width:1px; height:40px; background:#c5b89a;"></div>
                <nav class="links" style="display:flex; flex-wrap:wrap; gap:12px;"></nav>
                <div class="divisor" style="width:1px; height:40px; background:#c5b89a;"></div>
                <a href="avaliacao.html" class="btn btn-outline-primary" style="font-size:13px;">
                    Avaliar site <i class="bi-star"></i>
                </a>
            </div>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
