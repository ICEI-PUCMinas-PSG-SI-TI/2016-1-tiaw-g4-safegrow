<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeGrow — Chat com IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="safegrow.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div id="sg-header"></div>

    <div class="container py-5">
        
        <div class="chat-container mx-auto">
            
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h4 class="text-primary fw-bold mb-1">Fale com a IA</h4>
                    <p class="text-muted small mb-0">Combate à adultização infantil</p>
                </div>
                <button class="btn btn-outline-secondary btn-sm" id="clearChatBtn" title="Limpar conversa">
                    <i class="bi bi-trash"></i>
                </button>
            </div>

            <div class="chat-area mb-3" id="chatArea">
                <div id="welcomeMessage" class="text-center py-4">
                    <i class="bi bi-robot fs-2 text-primary mb-2 d-block"></i>
                    <p class="text-muted small">Faça sua pergunta abaixo:</p>
                </div>

                <div id="messagesContainer"></div>
                
                <div class="text-muted d-none mt-2 ps-2" id="typingIndicator">
                    <small><em>A IA está digitando...</em></small>
                </div>
            </div>

            <label class="form-label fw-bold small text-dark mb-1">Sua pergunta:</label>
            
            <textarea 
                class="form-control custom-input mb-3" 
                id="messageInput" 
                rows="3" 
                placeholder="Escreva sua pergunta aqui..."></textarea>
            
            <div class="d-flex gap-2">
                <button class="btn btn-primary flex-grow-1 d-flex justify-content-center align-items-center gap-2" id="sendBtn" disabled>
                    Enviar pergunta <i class="bi bi-send"></i>
                </button>
                <button class="btn btn-outline-secondary d-flex align-items-center gap-1" id="voltarBtn">
                    Voltar <i class="bi bi-arrow-left"></i>
                </button>
            </div>
            
        </div>

    </div>

    <div id="sg-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="componentes.js"></script>
    <script src="config.js" onerror="console.info('config.js não encontrado, usando fallback local se necessário.')"></script>
    <script src="chat.js"></script>
    
</body>
</html>
