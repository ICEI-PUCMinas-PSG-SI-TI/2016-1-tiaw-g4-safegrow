<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeGrow — Cadastro de Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="safegrow.css">

</head>
<body>

  <div id="sg-header"></div>

  <section class="sg-section">

    <!-- Formulário -->
    <div class="sg-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <p class="page-title m-0" id="cadTitle">Cadastro de Usuários</p>
        <div class="d-flex gap-2">
          <button id="btnVoltar" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" style="display: none;">
            <i class="bi-arrow-left"></i> Voltar
          </button>
          <button id="btnLogout" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" style="display: none;">
            Sair <i class="bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
      <p class="page-subtitle" id="cadSubTitle">Preencha os dados abaixo para criar ou editar um usuário</p>

      <form id="formUsuario">
        <input type="hidden" id="id">
        <div class="form-row">
          <div class="form-group">
            <label class="sg-label" for="nome">Nome</label>
            <input type="text" id="nome" class="sg-input" placeholder="Nome completo" required>
          </div>
          <div class="form-group">
            <label class="sg-label" for="email">Email</label>
            <input type="email" id="email" class="sg-input" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label class="sg-label" for="telefone">Telefone</label>
            <input type="text" id="telefone" class="sg-input" placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label class="sg-label" for="idade">Idade</label>
            <input type="number" id="idade" class="sg-input" placeholder="Ex: 30">
          </div>
        </div>
        <div class="form-group">
          <label class="sg-label" for="cidade">Cidade</label>
          <input type="text" id="cidade" class="sg-input" placeholder="Sua cidade">
        </div>
        <button type="submit" class="sg-btn mt-2" id="btnSalvar">
          Salvar usuário <i class="bi-check2-circle ms-1"></i>
        </button>
      </form>
      
      <div id="cadastroSucesso" class="mt-3" style="display:none;
           background:#eef2fd; border:1px solid #5b7fe0;
           border-radius:8px; padding:12px 16px;
           color:#5b7fe0; font-size:.88rem;">
        <i class="bi-check-circle me-1"></i> Cadastro realizado com sucesso!
      </div>
    </div>

    <!-- Tabela -->
    <div class="sg-card table-section" id="tabelaUsuariosCard" style="display: none;">
      <div class="table-header">
        <h2>Usuários cadastrados</h2>
        <input type="text" id="pesquisa" class="sg-input" placeholder="Pesquisar por nome…"
               style="width:220px;">
      </div>
      <div class="table-responsive">
        <table class="sg-table">
          <thead>
            <tr>
              <th>ID</th><th>Nome</th><th>Email</th>
              <th>Telefone</th><th>Idade</th><th>Cidade</th><th>Ações</th>
            </tr>
          </thead>
          <tbody id="listaUsuarios"></tbody>
        </table>
      </div>
    </div>

  </section>

  <div id="sg-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="componentes.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
