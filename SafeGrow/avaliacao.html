<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeGrow — Avaliar Site</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="safegrow.css">

</head>
<body>

  <div id="sg-header"></div>

  <div class="avaliacao-wrap">
    <div class="sg-card">
      <h2 style="color:#5b7fe0; font-weight:800; font-size:1.3rem; margin-bottom:4px;">
        Avalie o site
      </h2>
      <p style="color:#6b6b6b; font-size:.85rem; margin-bottom:24px;">
        Combate à adultização infantil
      </p>

      <label class="sg-label">Sua nota</label>
      <div id="estrelas">
        <i class="bi-star sg-star" onclick="selecionarNota(1)"></i>
        <i class="bi-star sg-star" onclick="selecionarNota(2)"></i>
        <i class="bi-star sg-star" onclick="selecionarNota(3)"></i>
        <i class="bi-star sg-star" onclick="selecionarNota(4)"></i>
        <i class="bi-star sg-star" onclick="selecionarNota(5)"></i>
      </div>
      <p id="nota-texto" style="font-size:.8rem; color:#6b6b6b; margin-bottom:20px;"></p>

      <label class="sg-label" for="comentario">Comentário</label>
      <textarea id="comentario" class="sg-input" rows="4"
                placeholder="Escreva seu comentário aqui…"
                style="margin-bottom:24px;"></textarea>

      <div style="display:flex; gap:12px;">
        <button class="sg-btn flex-fill" onclick="enviarAvaliacao()">
          Enviar avaliação <i class="bi-send ms-1"></i>
        </button>
        <a href="index.html" class="sg-btn-outline" style="text-decoration:none; padding:10px 18px;">
          Voltar <i class="bi-arrow-left ms-1"></i>
        </a>
      </div>

      <div id="mensagem" class="mt-3"
           style="display:none; background:#eef2fd; border:1px solid #5b7fe0;
                  border-radius:8px; padding:12px 16px;
                  color:#5b7fe0; font-size:.88rem;">
        <i class="bi-check-circle me-1"></i> Avaliação enviada com sucesso! ⭐
      </div>
    </div>
  </div>

  <div id="sg-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="componentes.js"></script>
  <script src="avaliacao.js"></script>
</body>
</html>
