<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Avaliar Site</title>
    <style>
        body { background-color: #f5f0e8; }
        .estrela {
            font-size: 40px;
            color: #c5b89a;
            cursor: pointer;
        }
        .estrela.ativa { color: #f5a623; }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4" style="background-color:#fff; border-style:dashed; border-color:#5b7fe0; max-width:480px; width:100%;">

            <h4 class="text-primary fw-bold mb-1">Avalie o site</h4>
            <p class="text-secondary mb-4" style="font-size:13px;">Combate à adultização infantil</p>

            <p class="fw-medium mb-2">Sua nota:</p>
            <div id="estrelas" class="d-flex gap-2 mb-3">
                <i class="bi-star estrela" onclick="selecionarNota(1)"></i>
                <i class="bi-star estrela" onclick="selecionarNota(2)"></i>
                <i class="bi-star estrela" onclick="selecionarNota(3)"></i>
                <i class="bi-star estrela" onclick="selecionarNota(4)"></i>
                <i class="bi-star estrela" onclick="selecionarNota(5)"></i>
            </div>

            <p class="fw-medium mb-2">Comentário:</p>
            <textarea id="comentario" class="form-control mb-4" rows="4" placeholder="Escreva seu comentário aqui..." style="background-color:#f5f0e8; border-color:#c5b89a;"></textarea>

            <div class="d-flex gap-2">
                <button class="btn btn-primary flex-fill" onclick="enviarAvaliacao()">
                    Enviar avaliação <i class="bi-send"></i>
                </button>
                <a href="footer.html" class="btn btn-outline-secondary">
                    Voltar <i class="bi-arrow-left"></i>
                </a>
            </div>

            <div id="mensagem" class="alert alert-success mt-3" style="display:none;">
                Avaliação enviada com sucesso! ⭐
            </div>

        </div>
    </div>

    <script src="avaliacao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
