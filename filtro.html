<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Notícias - Combate à Adultização Infantil</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header id="cabecalho" class="py-3 shadow-sm d-none">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h1 class="h5 mb-0"><i class="bi bi-newspaper"></i> Portal de Notícias</h1>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-light btn-sm fw-semibold" onclick="abrirModalFormulario()">Nova Notícia</button>
        <button class="btn btn-outline-danger btn-sm fw-semibold" onclick="resetarAlteracoes()">Resetar alterações</button>
      </div>
    </div>
  </header>

  <main id="tela-inicial">
    <button class="btn btn-custom btn-lg shadow-sm" id="btn-acessar">
      Acessar Notícias
    </button>
  </main>

  <section id="secao-noticias" class="container py-4 d-none">
    
    <div class="row g-3 mb-4 align-items-center">
      
      <div class="col-12 col-lg-4">
        <div class="input-group rounded">
          <span class="input-group-text search-icon-span border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" id="input-busca" class="form-control search-input border-start-0" placeholder="Buscar por palavra-chave...">
        </div>
      </div>
      
      <div class="col-12 col-lg-5 text-lg-center">
        <div class="d-flex flex-wrap gap-2 justify-content-start justify-content-lg-center" id="container-filtros">
          <button class="btn-filter active" data-categoria="Todas">Todas</button>
          <button class="btn-filter" data-categoria="Segurança">Segurança</button>
          <button class="btn-filter" data-categoria="Sociedade">Sociedade</button>
          <button class="btn-filter" data-categoria="Direitos Humanos">Direitos Humanos</button>
          <button class="btn-filter" data-categoria="Política">Política</button>
        </div>
      </div>
      
      <div class="col-12 col-lg-3 text-lg-end">
        <select id="select-ordem" class="form-select shadow-sm ms-auto" style="border-color: var(--texto-secundario); background-color: var(--bg-geral); display: inline-block; width: auto;">
          <option value="recentes">Mais recentes</option>
          <option value="antigas">Mais antigas</option>
        </select>
      </div>

    </div>

    <div id="mensagem-erro" class="alert alert-danger d-none text-center" role="alert"></div>
    <div id="mensagem-vazio" class="text-center py-5 d-none">
      <i class="bi bi-search" style="font-size: 3rem; color: var(--texto-secundario);"></i>
      <h3 class="mt-3" style="color: var(--texto-secundario);">Nenhuma notícia encontrada.</h3>
    </div>
    
    <div id="news-grid" class="news-grid">
    </div>

  </section>

  <div class="modal fade" id="modalNoticia" tabindex="-1" aria-labelledby="modalNoticiaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        
        <div class="modal-header border-0" style="background-color: var(--cor-primaria); color: white;">
          <h5 class="modal-title fw-bold" id="modalNoticiaLabel">Detalhes da Notícia</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        
        <div class="modal-body p-4" style="background-color: var(--fundo-cards);">
          <div class="mb-3">
            <span id="modal-categoria" class="badge rounded-pill mb-3 px-3 py-2"></span>
            <h2 id="modal-titulo" class="fw-bold mb-3" style="color: var(--texto-padrao);"></h2>
            
            <div class="text-muted small mb-4 d-flex gap-3">
              <span><i class="bi bi-person"></i> <span id="modal-autor"></span></span>
              <span><i class="bi bi-calendar3"></i> <span id="modal-data"></span></span>
            </div>
            
            <div id="modal-conteudo" style="line-height: 1.8; color: var(--texto-padrao);"></div>
          </div>
        </div>
        
        <div class="modal-footer border-0" style="background-color: var(--bg-geral);">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>

      </div>
    </div>
  </div>


  <div class="modal fade" id="modalFormNoticia" tabindex="-1" aria-labelledby="modalFormNoticiaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0" style="background-color: var(--cor-primaria); color: white;">
          <h5 class="modal-title fw-bold" id="modalFormNoticiaLabel">Nova Notícia</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body p-4" style="background-color: var(--fundo-cards);">
          <form id="form-noticia">
            <input type="hidden" id="form-id">
            <div class="mb-3">
              <label for="form-titulo" class="form-label fw-semibold" style="color: var(--texto-padrao);">Título</label>
              <input type="text" class="form-control" id="form-titulo" required>
            </div>
            <div class="mb-3">
              <label for="form-resumo" class="form-label fw-semibold" style="color: var(--texto-padrao);">Resumo</label>
              <textarea class="form-control" id="form-resumo" rows="2" required></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="form-categoria" class="form-label fw-semibold" style="color: var(--texto-padrao);">Categoria</label>
                <select class="form-select" id="form-categoria" required>
                  <option value="Segurança">Segurança</option>
                  <option value="Sociedade">Sociedade</option>
                  <option value="Direitos Humanos">Direitos Humanos</option>
                  <option value="Política">Política</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="form-autor" class="form-label fw-semibold" style="color: var(--texto-padrao);">Autor</label>
                <input type="text" class="form-control" id="form-autor" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="form-data" class="form-label fw-semibold" style="color: var(--texto-padrao);">Data</label>
              <input type="date" class="form-control" id="form-data" required>
            </div>
            <div class="mb-3">
              <label for="form-conteudo" class="form-label fw-semibold" style="color: var(--texto-padrao);">Conteúdo Completo</label>
              <textarea class="form-control" id="form-conteudo" rows="4"></textarea>
            </div>
            <div class="mb-3">
              <label for="form-url" class="form-label fw-semibold" style="color: var(--texto-padrao);">URL Externa (Opcional)</label>
              <input type="url" class="form-control" id="form-url" placeholder="https://...">
            </div>
          </form>
        </div>
        <div class="modal-footer border-0" style="background-color: var(--bg-geral);">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-custom" onclick="salvarNoticia()">Salvar Notícia</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
